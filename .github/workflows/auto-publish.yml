name: 7-24 Cloud Autonomous Publisher (07:00, 11:00, 15:00, 20:30 TR)

on:
  schedule:
    # Türkiye Saati (UTC+3) Kesin Günlük Yayın Takvimi:
    # 07:00 TR -> 04:00 UTC (Sabah Reels Bülteni)
    - cron: '0 4 * * *'
    # 11:00 TR -> 08:00 UTC (Gün Ortası Metin Haberi)
    - cron: '0 8 * * *'
    # 15:00 TR -> 12:00 UTC (Öğleden Sonra Reels Bülteni)
    - cron: '0 12 * * *'
    # 20:30 TR -> 17:30 UTC (Akşam Prime-Time Reels Bülteni)
    - cron: '30 17 * * *'
  workflow_dispatch:

concurrency:
  group: cloud-publisher-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish-slot:
    name: 7/24 Cloud Autonomous Daily Slot Publisher
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg & DejaVu Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Trigger Vercel Production Cloud Sync (Redundancy 1)
        run: |
          echo "Pinging Vercel Production Cron Endpoint..."
          curl -s -X POST -m 60 "https://bordomavi-ai.vercel.app/api/cron/sync-news?secret=test_secret" || echo "Vercel sync completed/timed out"

      - name: Execute Cloud Slot Publisher on Ubuntu Runner (Redundancy 2)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_MOCK_MODE: "false"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_APP_URL: "https://bordomavi-ai.vercel.app"
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'test_secret' }}
        run: |
          echo "Starting 7/24 Cloud Autonomous Publisher for active schedule slot..."
          npx tsx scripts/trigger_workflow.ts
